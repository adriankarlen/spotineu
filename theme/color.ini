; Rosé Pine (https://rosepinetheme.com/en/palette/), all three variants.
; Surface = base. Hover tint = surface (dawn: overlay). Highlight shadow = overlay (dawn: white,
; because the palette's surface is too close to base to read as a highlight). The palette has
; nothing darker than base, so neu-dark / shadow are base darkened in the same hue.
; Accent = rose, except dawn: rose is 2.6:1 on the dawn base, too faint for text, so dawn uses love.

[rose-pine]
