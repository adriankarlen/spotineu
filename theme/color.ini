; spotineu colour schemes
; Design contract: .agents/skills/spotineu-design/references/tokens.md
; main, main-elevated, sidebar, player and card share one surface value.
; neu-light / neu-dark are the highlight and shade shadows; on-accent is for icons/text on accent fills.
; Never put "#" before a hex value: Spicetify reads it as a comment.

